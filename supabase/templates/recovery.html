<!-- Phase 1b: the password-reset email. Same one-time token link as the
     sign-up email (works on any device). Staging and production: paste this
     into Authentication → Emails → Reset password (see README). -->
<h2>Reset your password</h2>
<p>Someone asked to reset the password for your Amanat account. Tap the button to choose a new one.</p>
<p><a href="{{ .RedirectTo }}&token_hash={{ .TokenHash }}&type=recovery">Set a new password</a></p>
<p>The link works once, for 1 hour. If you didn't ask for this, ignore this email: your password stays the same.</p>
